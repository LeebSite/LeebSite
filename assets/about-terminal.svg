<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="About Ghalib — terminal">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
