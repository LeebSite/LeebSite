name: Update contribution grid

on:
  schedule:
    # Setiap hari 01:00 WIB (18:00 UTC) — GitHub Actions pakai UTC
    - cron: "0 18 * * *"
  workflow_dispatch:  # tombol Run workflow manual di tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate contribution grid from real GitHub data
        run: python3 scripts/update_contributions.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-grid.svg
          git diff --cached --quiet || git commit -m "chore: update contribution grid [skip ci]"
          git push
